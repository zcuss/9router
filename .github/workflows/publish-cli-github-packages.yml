name: Publish CLI to npmjs

on:
  push:
    branches: [master]
    paths:
      - "cli/**"
      - "src/**"
      - "open-sse/**"
      - "public/**"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-cli-github-packages.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js for npmjs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install root dependencies
        run: npm install
        working-directory: .

      - name: Install CLI dependencies
        run: npm install
        working-directory: cli

      - name: Check if version already exists on npm
        id: version_check
        run: |
          PKG_NAME=$(node -p "require('./cli/package.json').name")
          PKG_VERSION=$(node -p "require('./cli/package.json').version")
          echo "name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

          if npm view "$PKG_NAME@$PKG_VERSION" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $PKG_VERSION already exists on npm. Skipping publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $PKG_VERSION not found on npm. Publishing..."
          fi

      - name: Publish to npmjs
        if: steps.version_check.outputs.exists == 'false'
        run: npm publish --access public --registry=https://registry.npmjs.org --provenance
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}